# Example .draft/config.toml for Draft.

schema_version = 1

[user]
name = "Ada"
email = "ada@example.com"

[submit]
message_template = "{{title}}\n\n{{description}}\n\nDraft-Task: {{task_id}}\nDraft-Execution: {{execution_id}}\nDraft-Pack: {{pack_id}}\nDraft-Verified: {{verified}}\nDraft-Risk: {{risk_level}}\nDraft-Receipt: {{receipt_id}}\nDraft-Actor: {{actor_name}}"
pack_disposal = "merge_and_dispose"

[verification]
default_profile = "standard"

[policy]
require_verification = true
require_approval = true
require_human_approval_for_high_risk = true
block_if_tests_fail = true
