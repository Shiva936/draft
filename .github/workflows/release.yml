name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, with or without leading v"
        required: true
        type: string
      dry_run:
        description: "Build and package without publishing a GitHub Release"
        required: false
        default: true
        type: boolean
      force:
        description: "Replace an existing GitHub Release for this version"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      force: ${{ steps.version.outputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            raw="${GITHUB_REF_NAME}"
            dry_run="false"
            force="false"
          else
            raw="${{ inputs.version }}"
            dry_run="${{ inputs.dry_run }}"
            force="${{ inputs.force }}"
          fi
          version="${raw#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - name: Validate version declarations
        shell: bash
        run: scripts/validate-version.sh "${{ steps.version.outputs.version }}"

      - name: Validate manual release ref
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="refs/tags/v${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "Manual non-dry-run releases must be run from $expected_ref, not $GITHUB_REF." >&2
            exit 1
          fi

  test:
    name: Test on ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global commit.gpgsign false

      - name: Format
        run: cargo fmt --all -- --check

      - name: Version consistency
        shell: bash
        run: scripts/validate-version.sh "${{ needs.version.outputs.version }}"

      - name: Console architecture contracts
        shell: bash
        run: scripts/check-console-architecture.sh

      - name: Core architecture contracts
        shell: bash
        run: scripts/check-core-architecture.sh

      - name: Canonical contract names
        shell: bash
        run: scripts/check-draft-contract-names.sh

      - name: Closed per-contract schema registry
        shell: bash
        run: scripts/check-contract-registry.sh

      - name: Documentation consistency
        shell: bash
        run: scripts/check-docs-consistency.sh

      - name: Generated Console contract drift
        shell: bash
        run: scripts/check-generated-console-contracts.sh

      - name: Installer syntax
        shell: bash
        run: bash -n scripts/validate-version.sh scripts/package-release.sh install.sh && sh -n install.sh

      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $tokens = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw install.ps1), [ref]$errors)
          if ($null -ne $errors -and $errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Doctests
        run: cargo test --workspace --doc

  console:
    name: Console (Linux)
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Component tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Verify committed bundle is reproducible
        working-directory: .
        shell: bash
        run: |
          git diff --exit-code -- console/dist
          test -z "$(git status --porcelain --untracked-files=all -- console/dist)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build real Console processes
        working-directory: .
        run: cargo build --locked -p draft-cli -p draftd

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Real Console browser and screenshot tests
        run: npm run test:e2e

  security:
    name: RustSec audit
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

  build:
    name: Build ${{ matrix.target }}
    needs: [version, test, console, security]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross
          - os: macos-latest
            target: x86_64-apple-darwin
            builder: cargo
          - os: macos-latest
            target: aarch64-apple-darwin
            builder: cargo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builder: cargo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build with cargo
        if: matrix.builder == 'cargo'
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.builder == 'cross'
        run: cross build --workspace --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: scripts/package-release.sh "${{ needs.version.outputs.version }}" "${{ matrix.target }}" dist

      # I53: the packaged binary itself reports the release-verification key
      # set it embeds. The sidecar sits beside the archive, never inside it.
      - name: Packaged trust set
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          target="${{ matrix.target }}"
          name="draft-v${version}-${target}"
          work="$(mktemp -d)"
          case "$target" in
            *windows*) unzip -q "dist/$name.zip" -d "$work"; exe="$work/$name/bin/draft.exe" ;;
            *) tar -xzf "dist/$name.tar.gz" -C "$work"; exe="$work/$name/bin/draft" ;;
          esac
          if [ "$target" = "aarch64-unknown-linux-musl" ]; then
            # Run the same release build through the installed cross runner.
            cross run --release --target "$target" -p draft-cli --bin draft -- release-trust-set --json > "dist/$name.trust-set.json"
          else
            "$exe" release-trust-set --json > "dist/$name.trust-set.json"
          fi
          cat "dist/$name.trust-set.json"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: Checksums
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
      contents: read
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          path: source

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          allow_empty=""
          [ "${{ needs.version.outputs.dry_run }}" = "true" ] && allow_empty="--allow-empty"
          python3 source/scripts/release-manifest.py generate \
            --version "${{ needs.version.outputs.version }}" --dist dist $allow_empty

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum draft-v${{ needs.version.outputs.version }}-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: draft-release-v${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign release manifest
    needs: [version, checksums]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    # The protected release environment is the only place active private keys
    # exist; PR, fork and untrusted workflows receive none.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: draft-release-v${{ needs.version.outputs.version }}
          path: dist

      - name: Channel-safe retirement gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY_IDS: ${{ vars.RELEASE_SIGNING_KEY_IDS }}
        run: python3 scripts/release-manifest.py retirement-gate --repo "${{ github.repository }}" --active-key-ids "$RELEASE_SIGNING_KEY_IDS"

      - name: Sign the exact manifest bytes with every active key
        shell: bash
        env:
          RELEASE_SIGNING_KEY_IDS: ${{ vars.RELEASE_SIGNING_KEY_IDS }}
          RELEASE_SIGNING_KEY_1: ${{ secrets.RELEASE_SIGNING_KEY_1 }}
          RELEASE_SIGNING_KEY_2: ${{ secrets.RELEASE_SIGNING_KEY_2 }}
          RELEASE_SIGNING_KEY_3: ${{ secrets.RELEASE_SIGNING_KEY_3 }}
          RELEASE_SIGNING_KEY_4: ${{ secrets.RELEASE_SIGNING_KEY_4 }}
        run: |
          set -euo pipefail
          keys_dir="$RUNNER_TEMP/release-keys"
          mkdir -m 700 "$keys_dir"
          IFS=',' read -r -a expected <<< "$RELEASE_SIGNING_KEY_IDS"
          [ "${#expected[@]}" -ge 1 ] || { echo "no active signing key ids configured" >&2; exit 1; }
          index=0
          for key_id in "${expected[@]}"; do
            index=$((index + 1))
            var="RELEASE_SIGNING_KEY_${index}"
            pem="${!var:-}"
            [ -n "$pem" ] || { echo "missing secret $var for $key_id" >&2; exit 1; }
            key="$keys_dir/$index.pem"
            ( umask 077; printf '%s\n' "$pem" > "$key" )
            openssl pkey -in "$key" -pubout -outform DER | tail -c 32 > "$keys_dir/$index.pub"
            derived="rk_$(sha256sum "$keys_dir/$index.pub" | cut -c1-12)"
            if [ "$derived" != "$key_id" ]; then
              echo "secret $var derives $derived, expected $key_id" >&2
              exit 1
            fi
            signature="$(openssl pkeyutl -sign -inkey "$key" -rawin -in dist/release-manifest.json | base64 -w0)"
            envelope="{\"schema_version\":1,\"key_id\":\"$key_id\",\"algorithm\":\"ed25519\",\"signature\":\"$signature\"}"
            printf '%s' "$envelope" > "dist/release-manifest.$key_id.sig"
            [ "$index" -eq 1 ] && printf '%s' "$envelope" > dist/release-manifest.sig
          done

      - name: Verify signatures and manifest consistency
        shell: bash
        run: |
          set -euo pipefail
          keys_dir="$RUNNER_TEMP/release-keys"
          for pub in "$keys_dir"/*.pub; do
            index="$(basename "$pub" .pub)"
            key_id="rk_$(sha256sum "$pub" | cut -c1-12)"
            openssl pkey -in "$keys_dir/$index.pem" -pubout -out "$keys_dir/$index.pub.pem"
            python3 -c "import json,base64,sys; sys.stdout.buffer.write(base64.b64decode(json.load(open('dist/release-manifest.$key_id.sig'))['signature']))" > "$keys_dir/$index.sig"
            openssl pkeyutl -verify -pubin -inkey "$keys_dir/$index.pub.pem" -rawin -in dist/release-manifest.json -sigfile "$keys_dir/$index.sig"
          done
          python3 scripts/release-manifest.py check --dist dist

      - name: Remove key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-keys"

      - name: Upload signed payload
        uses: actions/upload-artifact@v4
        with:
          name: draft-release-signed-v${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [version, sign]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: draft-release-signed-v${{ needs.version.outputs.version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          FORCE: ${{ needs.version.outputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              gh release delete "$tag" --yes
            else
              echo "Release $tag already exists. Re-run with force=true to replace it." >&2
              exit 1
            fi
          fi
          gh release create "$tag" dist/* \
            --title "Draft $tag" \
            --notes-file RELEASE_NOTES.md \
            --latest
