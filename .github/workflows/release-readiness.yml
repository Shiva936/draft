name: release-readiness

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  console:
    name: Console (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Component tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Verify committed bundle is reproducible
        working-directory: .
        shell: bash
        run: |
          git diff --exit-code -- console/dist
          test -z "$(git status --porcelain --untracked-files=all -- console/dist)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build real Console processes
        working-directory: .
        run: cargo build --locked -p draft-cli -p draftd

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Real Console browser and screenshot tests
        run: npm run test:e2e

  security:
    name: RustSec audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

  rust:
    name: ${{ matrix.os }}
    needs: [console, security]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global commit.gpgsign false

      - name: Format
        run: cargo fmt --all -- --check

      - name: Version consistency
        shell: bash
        run: scripts/validate-version.sh

      - name: Console architecture contracts
        shell: bash
        run: scripts/check-console-architecture.sh

      - name: Core architecture contracts
        shell: bash
        run: scripts/check-core-architecture.sh

      - name: Canonical contract names
        shell: bash
        run: scripts/check-draft-contract-names.sh

      - name: Closed per-contract schema registry
        shell: bash
        run: scripts/check-contract-registry.sh

      - name: Documentation consistency
        shell: bash
        run: scripts/check-docs-consistency.sh

      - name: Generated Console contract drift
        shell: bash
        run: scripts/check-generated-console-contracts.sh

      - name: Installer syntax
        shell: bash
        run: bash -n scripts/validate-version.sh scripts/package-release.sh install.sh && sh -n install.sh

      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $tokens = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw install.ps1), [ref]$errors)
          if ($null -ne $errors -and $errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Doctests
        run: cargo test --workspace --doc

      - name: Release build
        run: cargo build --workspace --release
