[package]
name = "draft-extension-service"
version = "0.3.4"
edition = "2021"

[dependencies]
draft-core = { path = "../../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tar = "0.4"
tempfile = "3"
semver = "1"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
