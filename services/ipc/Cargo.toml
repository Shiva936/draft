[package]
name = "draft-ipc"
version = "0.3.4"
edition = "2021"

[dependencies]
draft-core = { path = "../../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["chrono"] }
ts-rs = { version = "10", features = ["chrono-impl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
