[package]
name = "draft-draftpack-contract"
version = "0.3.4"
edition = "2021"
description = "Draft's portable DraftPack interchange format: manifests, canonical archive entry metadata, the safe path grammar, format limits, signing payloads and verification."
license = "Apache-2.0"
repository = "https://github.com/Shiva936/draft"
readme = "README.md"

[dependencies]
draft-dcg-contract = { version = "0.3.4", path = "../dcg-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Signing appears only in tests. The crate itself verifies and never signs: a
# format contract that could produce signatures would be a signing tool, and
# the exporter's key belongs to Draft, not to the portable format.
[dev-dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
