[package]
name = "draft-cli"
version = "0.3.4"
edition = "2021"
default-run = "draft"

[[bin]]
name = "draft"
path = "src/main.rs"

[dependencies]
draft-core = { path = "../core" }
draft-ipc = { path = "../services/ipc" }
draft-console-tui = { path = "../console/tui" }
draft-console = { path = "../console" }
draft-extension-service = { path = "../services/extension-service" }
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
# `draft update`: HTTPS release resolution, same client stack the extension
# catalog already uses.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.0"
predicates = "3.0"
serde_json = "1.0"
